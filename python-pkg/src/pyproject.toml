[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "VerbalSafe-profanity-filter"
version = "1.0.0"
authors = [
  { name="Manzi Irakoze Kevin" },
]
description = "A multi-language profanity filter for Python and Django."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]